
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven installieren und Build ausführen
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Prüfen, ob die JAR existiert
        run: |
          test -f target/NeptunCore-1.0.0.jar
          ls -lh target/NeptunCore-1.0.0.jar

      - name: Plugin zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: NeptunCore
          path: target/NeptunCore-1.0.0.jar
          if-no-files-found: error

      - name: GitHub Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/NeptunCore-1.0.0.jar
